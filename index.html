<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo chimba</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
    <!-- Componentes -->
    <script>
        // Boton de audio: cambia el icono play/stop
        AFRAME.registerComponent('boton-audio', {
            schema: {
                iconoPlay: { default: '#icono-audio' },
                iconoStop: { default: '#icono-detener' }
            },
            init: function () {
                var self = this;
                this.sonando = false;
                this.ultimo = 0;
                this.el.addEventListener('mouseenter', function () { console.log('mirando un boton-audio'); });
                this.el.addEventListener('click', function () {
                    var ahora = Date.now();
                    // Evita la doble activacion (click del mouse + mirada fija)
                    if (ahora - self.ultimo < 2000) { return; }
                    self.ultimo = ahora;
                    console.log('CLICK en boton-audio, sonando =', self.sonando);
                    if (self.sonando) { self.detener(); } else { self.reproducir(); }
                });
                this.el.addEventListener('sound-ended', function () { self.estado(false); });
            },
            reproducir: function () {
                var sound = this.el.components.sound;
                // Los navegadores bloquean el audio hasta que hay una interaccion: lo reanudamos
                var listener = this.el.sceneEl.audioListener;
                if (listener && listener.context.state === 'suspended') { listener.context.resume(); }
                if (!sound || !sound.loaded) { console.error('El sonido de este boton NO ha cargado (revisa el .mp3 en Assets)'); }
                this.estado(true);
                if (sound) { sound.playSound(); }
            },
            detener: function () {
                this.estado(false);
                if (this.el.components.sound) { this.el.components.sound.stopSound(); }
            },
            estado: function (sonando) {
                this.sonando = sonando;
                this.el.setAttribute('material', 'src', sonando ? this.data.iconoStop : this.data.iconoPlay);
            }
        });

        // Texto con Press Start 2P (usa | para saltar de linea)
        AFRAME.registerComponent('pixel-text', {
            schema: {
                value: { default: '' },
                color: { default: '#FFFFFF' },
                size:  { default: 0.07 },
                width: { default: 1.4 },
                font:  { default: './Assets/PressStart2P.ttf' }
            },
            init: function () {
                var el = this.el, d = this.data;
                var props = {
                    value: d.value.split('|').join('\n'),
                    color: d.color, fontSize: d.size, maxWidth: d.width,
                    align: 'center', anchorX: 'center', anchorY: 'middle', lineHeight: 1.6
                };
                fetch(d.font)
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); props.font = d.font; })
                    .catch(function (e) {
                        console.error('No cargo la fuente ' + d.font + ' (' + e.message + '). Uso la fuente por defecto. Revisa el nombre en Assets y que uses un servidor.');
                    })
                    .then(function () { el.setAttribute('troika-text', props); });
            }
        });

        // Zona invisible: al mirarla suena el audio y al mirarla otra vez se detiene (sin icono)
        AFRAME.registerComponent('zona-sonido', {
            init: function () {
                var el = this.el, self = this;
                this.sonando = false;
                this.ultimo = 0;
                el.addEventListener('click', function () {
                    var ahora = Date.now();
                    if (ahora - self.ultimo < 2000) { return; }   // evita doble activacion (mouse + mirada)
                    self.ultimo = ahora;
                    var sound = el.components.sound;
                    if (!sound) { return; }
                    if (self.sonando) {
                        self.sonando = false;
                        sound.stopSound();
                    } else {
                        var listener = el.sceneEl.audioListener;
                        if (listener && listener.context.state === 'suspended') { listener.context.resume(); }
                        if (!sound.loaded) { console.error('El sonido del escritorio NO ha cargado (revisa Assets/llamada.mp3)'); }
                        self.sonando = true;
                        sound.playSound();
                    }
                });
                el.addEventListener('sound-ended', function () { self.sonando = false; });
            }
        });

        // Punto en el piso: al mirarlo (o hacer click) mueve al usuario hasta ahi
        AFRAME.registerComponent('punto-mover', {
            init: function () {
                var el = this.el;
                el.addEventListener('click', function () {
                    var rig = document.querySelector('#rig');
                    var desde = rig.object3D.position;
                    var destino = el.object3D.position;
                    rig.setAttribute('animation__mover', {
                        property: 'position',
                        from: desde.x + ' 0 ' + desde.z,
                        to: destino.x + ' 0 ' + destino.z,
                        dur: 700,
                        easing: 'easeInOutQuad'
                    });
                });
            }
        });

        // Diagnostico de imagenes y audios
        window.addEventListener('load', function () {
            document.querySelectorAll('a-assets img').forEach(function (i) {
                if (!i.complete || i.naturalWidth === 0) console.error('Imagen NO cargo: ' + i.getAttribute('src'));
            });
            document.querySelectorAll('a-assets audio').forEach(function (a) {
                if (a.error) console.error('Audio NO cargo: ' + a.getAttribute('src'));
            });
        });
    </script>

    <!-- Script para el Jumpscare -->
    <script>
        AFRAME.registerComponent('activar-screamer', {
            // tiempo = milisegundos que hay que mirarlo para que salga el screamer
            schema: { tiempo: { default: 3000 } },
            init: function () {
                let self = this;
                let el = this.el;
                let pantalla = document.querySelector('#pantalla-screamer');
                let video = document.querySelector('#videoScreamer');
                let sonidoGolden = document.querySelector('#sonidoGolden');
                let temporizador = null;
                let activo = false;

                function lanzar() {
                    activo = true;
                    pantalla.setAttribute('visible', 'true');
                    if (sonidoGolden) { sonidoGolden.currentTime = 0; sonidoGolden.play(); }
                    if (video) { video.currentTime = 0; video.play(); }

                    // Oculta el screamer a los 3 segundos
                    setTimeout(() => {
                        pantalla.setAttribute('visible', 'false');
                        if (video) { video.pause(); }
                        activo = false;
                    }, 3000);
                }

                // Empieza a contar cuando lo miras y cancela si apartas la mirada
                el.addEventListener('mouseenter', function () {
                    if (activo) return;
                    clearTimeout(temporizador);
                    temporizador = setTimeout(lanzar, self.data.tiempo);
                });
                el.addEventListener('mouseleave', function () { clearTimeout(temporizador); });
            }
        });
    </script>
</head>
<body>

    <!-- Escena del proyecto VR -->
